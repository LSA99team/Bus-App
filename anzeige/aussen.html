<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busanzeige – Außen</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;700;900&display=swap');

  :root {
    --bg: #000;
    --amber: #ffb800;
    --amber-dim: #7a5800;
    --via-color: #ffdd80;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    font-family: 'Titillium Web', sans-serif;
    color: var(--amber);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 20px 28px;
    gap: 0;
  }

  /* ── OBERE ZEILE ── */

  #obere-zeile {
    display: flex;
    align-items: center;
    gap: 24px;
    flex: 0 0 auto;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--amber-dim);
  }

  #linie-nr {
    font-size: clamp(5rem, 14vw, 10rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--amber);
    text-shadow:
      0 0 30px rgba(255,184,0,0.4),
      0 0 60px rgba(255,184,0,0.2);

    flex-shrink: 0;
    min-width: 140px;
    text-align: center;
  }

  #ziel-text {
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 1px;
    flex: 1;
    word-break: break-word;

    text-shadow: 0 0 20px rgba(255,184,0,0.3);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, var(--amber-dim), transparent);
    margin: 10px 0;
  }

  /* ── VIA ── */

  #via-bereich {
    flex: 1;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  #via-label {
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 700;
    color: var(--amber-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-right: 20px;
    padding-right: 20px;
    border-right: 2px solid var(--amber-dim);
    white-space: nowrap;
  }

  #via-anzeige {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 700;
    color: var(--via-color);
    letter-spacing: 1px;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-shadow: 0 0 15px rgba(255,221,128,0.3);
  }

  .via-slide-out {
    animation: slideOut 0.4s ease-in forwards;
  }

  .via-slide-in {
    animation: slideIn 0.4s ease-out forwards;
  }

  @keyframes slideOut {
    from {
      opacity: 1;
      transform: translateY(0);
    }

    to {
      opacity: 0;
      transform: translateY(-30px);
    }
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;

    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );

    pointer-events: none;
    z-index: 999;
  }

  /* ── CONFIG ── */

  #config-btn {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #666;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
    z-index: 100;
    font-family: inherit;
  }

  #config-btn:hover {
    background: #2a2a2a;
    color: #aaa;
  }

  #config-panel {
    display: none;
    position: fixed;
    bottom: 40px;
    right: 10px;
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    z-index: 100;
    min-width: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.9);
  }

  #config-panel.open {
    display: block;
  }

  #config-panel h3 {
    color: var(--amber);
    font-size: 0.9rem;
    margin-bottom: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .cfg-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }

  .cfg-row label {
    font-size: 0.75rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .cfg-row select,
  .cfg-row input {
    background: #000;
    border: 1px solid #444;
    color: var(--amber);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  .cfg-apply {
    background: var(--amber);
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    width: 100%;
    margin-top: 4px;
  }

  .cfg-apply:hover {
    background: #ffd040;
  }
</style>
</head>

<body>

<button id="config-btn" onclick="toggleConfig()">⚙</button>

<div id="config-panel">
  <h3>Außenanzeige</h3>

  <div class="cfg-row">
    <label>Linie</label>
    <select id="cfg-linie" onchange="updateVariantenAuswahl()"></select>
  </div>

  <div class="cfg-row">
    <label>Variante</label>
    <select id="cfg-variante"></select>
  </div>

  <div class="cfg-row">
    <label>Via-Orte wechseln alle (Sekunden)</label>
    <input type="number" id="cfg-intervall" value="3" min="1" max="30">
  </div>

  <button class="cfg-apply" onclick="applyConfig()">
    ▶ Anwenden
  </button>
</div>

<div id="obere-zeile">
  <div id="linie-nr">–</div>
  <div id="ziel-text">–</div>
</div>

<div id="via-bereich">
  <div id="via-label">via</div>
  <div id="via-anzeige">–</div>
</div>

<script src="routen.js"></script>

<script>

// ─────────────────────────────────────────────
//  AUSSENANZEIGE – Steuerung
// ─────────────────────────────────────────────

let aktuelleRoute    = null;
let aktuelleVariante = null;
let viaStops         = [];
let viaIndex         = 0;
let intervall        = 3000;
let timer            = null;

// Via-Stops aus Variante holen
function berechneViaStops(variante) {

  if (!variante) return [];

  // Eigene Via-Punkte gesetzt
  if (
    Array.isArray(variante.via) &&
    variante.via.length > 0
  ) {
    return variante.via;
  }

  // Keine Via-Punkte
  return [];
}

function renderAnzeige() {

  if (!aktuelleRoute || !aktuelleVariante) return;

  const stops = aktuelleVariante.stopNamen;

  const ziel = stops[stops.length - 1] || '–';

  document.getElementById('linie-nr').textContent =
    aktuelleRoute.nummer;

  document.getElementById('ziel-text').textContent =
    ziel;

  // HIER GEÄNDERT
  viaStops = berechneViaStops(aktuelleVariante);

  viaIndex = 0;

  zeigeVia();
}

function zeigeVia() {

  const el = document.getElementById('via-anzeige');

  if (viaStops.length === 0) {
    el.textContent = '–';
    return;
  }

  // Slide-out
  el.classList.remove('via-slide-in');
  el.classList.add('via-slide-out');

  setTimeout(() => {

    el.textContent = viaStops[viaIndex];

    el.classList.remove('via-slide-out');
    el.classList.add('via-slide-in');

    viaIndex =
      (viaIndex + 1) % viaStops.length;

  }, 400);
}

function startTimer() {

  if (timer) {
    clearInterval(timer);
  }

  if (viaStops.length > 0) {
    timer = setInterval(
      zeigeVia,
      intervall
    );
  }
}

// ── Konfig ──

function ladeKonfigPanel() {

  const linienSelect =
    document.getElementById('cfg-linie');

  linienSelect.innerHTML = '';

  getAlleRouten().forEach(r => {

    const opt =
      document.createElement('option');

    opt.value = r.nummer;

    opt.textContent =
      r.nummer + ' – ' + r.name;

    linienSelect.appendChild(opt);
  });

  updateVariantenAuswahl();
}

function updateVariantenAuswahl() {

  const nr = parseInt(
    document.getElementById('cfg-linie').value
  );

  const route = getRoute(nr);

  const varSel =
    document.getElementById('cfg-variante');

  varSel.innerHTML = '';

  if (!route) return;

  route.varianten.forEach((v, i) => {

    const opt =
      document.createElement('option');

    opt.value = i;
    opt.textContent = v.name;

    varSel.appendChild(opt);
  });
}

function applyConfig() {

  const nr = parseInt(
    document.getElementById('cfg-linie').value
  );

  const varIdx = parseInt(
    document.getElementById('cfg-variante').value
  );

  const sek = parseInt(
    document.getElementById('cfg-intervall').value
  ) || 3;

  aktuelleRoute = getRoute(nr);

  aktuelleVariante =
    aktuelleRoute.varianten[varIdx];

  intervall = sek * 1000;

  renderAnzeige();

  startTimer();

  document
    .getElementById('config-panel')
    .classList.remove('open');
}

function toggleConfig() {

  document
    .getElementById('config-panel')
    .classList.toggle('open');
}

window.addEventListener('load', () => {

  ladeKonfigPanel();

  const ersteRoute = getAlleRouten()[0];

  if (ersteRoute) {

    aktuelleRoute = ersteRoute;

    aktuelleVariante =
      ersteRoute.varianten[0];

    intervall = 3000;

    renderAnzeige();

    startTimer();
  }
});

</script>
</body>
</html>
